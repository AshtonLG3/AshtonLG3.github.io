<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1c2f49">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Supervisor Check Point">
    <title>Supervisor Check Point</title>
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap">
    <link rel="stylesheet" href="/dist.css">
  </head>
  <body class="scanner-page supervisor-checkpoint-v2">
    <main class="phone-shell supervisor-phone-shell">
      <section id="supervisor-app" class="phone-screen supervisor-screen">
        <section class="scanner-card supervisor-card" aria-live="polite">
          <header class="scanner-header supervisor-header">
            <span id="supervisor-now" class="scanner-time phone-time">--:--</span>
            <p class="employee-label">Supervisor App</p>
            <h1 class="scanner-owner">Check Point</h1>
            <div class="work-row">
              <span>Status</span>
              <strong id="supervisor-status" class="employee-pill">READY</strong>
            </div>
          </header>

          <section id="supervisor-login-panel" class="supervisor-login-panel">
            <form id="supervisor-login-form" class="supervisor-stack-form">
              <label>
                <span>Supervisor link</span>
                <input id="supervisor-login-link" name="supervisorLink" autocomplete="off" placeholder="Paste one-time office link" required>
              </label>
              <button id="supervisor-login-button" class="supervisor-primary-action" type="submit">
                <svg class="supervisor-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="currentColor" d="M10 17v-3H3v-4h7V7l5 5-5 5Zm-1 4v-2h10V5H9V3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H9Z" />
                </svg>
                <span>Log In</span>
              </button>
              <small id="supervisor-login-message" class="scanner-status-capsule text-primary" role="status" aria-live="polite"></small>
            </form>
          </section>

          <div id="supervisor-workspace" class="supervisor-workspace hidden">
          <section id="checkpoint-tab" class="mobile-tab-panel active supervisor-tab-panel" data-supervisor-tab-panel="checkpoint">
            <form id="supervisor-terminal-form" class="supervisor-checkpoint-form">
              <section class="scanner-frame supervisor-qr-frame" aria-label="Live Check Point QR">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div id="supervisor-terminal-qr" class="supervisor-terminal-qr">
                  <svg class="supervisor-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M3 3h7v7H3V3Zm2 2v3h3V5H5Zm9-2h7v7h-7V3Zm2 2v3h3V5h-3ZM3 14h7v7H3v-7Zm2 2v3h3v-3H5Zm9-2h3v3h-3v-3Zm5 0h2v2h-2v-2Zm-5 5h2v2h-2v-2Zm4-2h3v4h-3v-2h-2v-2h2v-2Z" />
                  </svg>
                  <strong>Generate QR</strong>
                </div>
              </section>

              <div class="supervisor-control-card">
                <label class="supervisor-device-field">
                  <span>Supervisor device</span>
                  <input id="supervisor-device-label" name="deviceLabel" autocomplete="name" maxlength="80" placeholder="Gate phone">
                </label>

                <button id="supervisor-generate-button" class="supervisor-primary-action" type="submit">
                  <svg class="supervisor-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M3 3h7v7H3V3Zm2 2v3h3V5H5Zm9-2h7v7h-7V3Zm2 2v3h3V5h-3ZM3 14h7v7H3v-7Zm2 2v3h3v-3H5Zm9-2h3v3h-3v-3Zm5 0h2v2h-2v-2Zm-5 5h2v2h-2v-2Zm4-2h3v4h-3v-2h-2v-2h2v-2Z" />
                  </svg>
                  <span>Generate Check Point</span>
                </button>
              </div>

              <div class="supervisor-meta-grid">
                <section class="next-action-card supervisor-expiry-card">
                  <span>Expires</span>
                  <strong id="supervisor-expiry" class="scanner-state">--</strong>
                </section>

                <div class="supervisor-location-card">
                  <span>Mandatory GPS</span>
                  <strong id="supervisor-location-text">Not captured</strong>
                  <a id="supervisor-map-link" class="hidden" href="#" target="_blank" rel="noopener">Open map</a>
                </div>
              </div>

              <div class="scanner-copy supervisor-copy">
                <small id="supervisor-message" class="scanner-status-capsule text-primary" role="status" aria-live="polite">Ready for issued employee apps</small>
              </div>
            </form>
          </section>

          <section id="manual-tab" class="mobile-tab-panel supervisor-tab-panel" data-supervisor-tab-panel="manual">
            <div class="mobile-panel-card supervisor-panel-card">
              <h2>Manual Field Clock</h2>
              <form id="supervisor-manual-form" class="supervisor-stack-form">
                <label>
                  <span>Employee</span>
                  <select id="supervisor-manual-employee" name="targetEmployeeId" required></select>
                </label>

                <fieldset class="stitch-segmented supervisor-segmented" aria-label="Manual action">
                  <label>
                    <input type="radio" name="action" value="in" checked>
                    <span>Clock In</span>
                  </label>
                  <label>
                    <input type="radio" name="action" value="out">
                    <span>Clock Out</span>
                  </label>
                </fieldset>

                <label>
                  <span>Reason</span>
                  <input id="supervisor-manual-reason" name="reason" autocomplete="off" maxlength="120" placeholder="Scanner not available">
                </label>

                <button id="supervisor-manual-button" class="supervisor-secondary-action" type="submit">
                  <svg class="supervisor-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M9 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0 2c2.67 0 8 1.34 8 4v2H1v-2c0-2.66 5.33-4 8-4Zm9.2 5.6-3.2-3.2 1.4-1.4 1.8 1.8 4.4-4.4 1.4 1.4-5.8 5.8Z" />
                  </svg>
                  <span>Record Clock</span>
                </button>
              </form>
            </div>
          </section>

          <section id="flag-tab" class="mobile-tab-panel supervisor-tab-panel" data-supervisor-tab-panel="flag">
            <div class="mobile-panel-card supervisor-panel-card">
              <h2>Flag Employee</h2>
              <form id="supervisor-flag-form" class="supervisor-stack-form">
                <label>
                  <span>Employee</span>
                  <select id="supervisor-flag-employee" name="targetEmployeeId" required></select>
                </label>
                <label>
                  <span>Flag note</span>
                  <input id="supervisor-flag-reason" name="reason" autocomplete="off" maxlength="160" placeholder="Needs office review" required>
                </label>
                <button id="supervisor-flag-button" class="supervisor-secondary-action" type="submit">
                  <svg class="supervisor-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M5 21V3h11l.6 3H21v10h-6.4l-.6-3H7v8H5Zm2-10h8.6l.6 3H19V8h-4.1l-.6-3H7v6Z" />
                  </svg>
                  <span>Flag for Office</span>
                </button>
              </form>
            </div>
          </section>

          <section id="activity-tab" class="mobile-tab-panel supervisor-tab-panel" data-supervisor-tab-panel="activity">
            <div class="mobile-panel-card supervisor-panel-card supervisor-activity-card">
              <h2>Device Activity</h2>
              <div id="supervisor-recent-list" class="supervisor-recent-list"></div>
            </div>
          </section>

          <nav class="bottom-nav supervisor-bottom-nav" aria-label="Supervisor navigation">
            <button class="active" type="button" data-supervisor-tab="checkpoint" aria-current="page">
              <svg class="supervisor-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M3 3h7v7H3V3Zm2 2v3h3V5H5Zm9-2h7v7h-7V3Zm2 2v3h3V5h-3ZM3 14h7v7H3v-7Zm2 2v3h3v-3H5Zm9-2h3v3h-3v-3Zm5 0h2v2h-2v-2Zm-5 5h2v2h-2v-2Zm4-2h3v4h-3v-2h-2v-2h2v-2Z" />
              </svg>
              <strong>QR</strong>
            </button>
            <button type="button" data-supervisor-tab="manual">
              <svg class="supervisor-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M9 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0 2c2.67 0 8 1.34 8 4v2H1v-2c0-2.66 5.33-4 8-4Zm9.2 5.6-3.2-3.2 1.4-1.4 1.8 1.8 4.4-4.4 1.4 1.4-5.8 5.8Z" />
              </svg>
              <strong>Manual</strong>
            </button>
            <button type="button" data-supervisor-tab="flag">
              <svg class="supervisor-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M5 21V3h11l.6 3H21v10h-6.4l-.6-3H7v8H5Zm2-10h8.6l.6 3H19V8h-4.1l-.6-3H7v6Z" />
              </svg>
              <strong>Flag</strong>
            </button>
            <button type="button" data-supervisor-tab="activity">
              <svg class="supervisor-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 3a9 9 0 1 1-8.1 5H1l4-4 4 4H6.1A7 7 0 1 0 12 5v4l4 2-.9 1.8L10 10.3V3h2Z" />
              </svg>
              <strong>Activity</strong>
            </button>
          </nav>
          </div>
        </section>
      </section>
    </main>

    <script src="/supervisor.js" defer></script>
  </body>
</html>
